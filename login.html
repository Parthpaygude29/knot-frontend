<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knot — Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .auth-logo {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: 2rem;
            display: inline-block;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            transition: all var(--transition);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .auth-form {
            text-align: left;
        }
        #signupFields {
            display: none; /* Hidden by default */
        }
        .auth-error {
            color: #d32f2f;
            background-color: #fde0e0;
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="card auth-card reveal-on-scroll">
            <a href="index.html" class="auth-logo" style="display: inline-block; margin-bottom: 2rem;">
                <img src="assets/logo.png" alt="Knot Logo" style="height: 60px; filter: invert(1) brightness(2); mix-blend-mode: screen;">
            </a>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin">Sign In</div>
                <div class="auth-tab" id="tabSignup">Create Account</div>
            </div>

            <div id="authErrorMessage" class="auth-error"></div>

            <form class="auth-form" id="authForm">
                <div id="signupFields">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="e.g. Jane Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
            </form>
            
            <p class="auth-footer">
                By continuing, you agree to Knot's Terms of Service and Privacy Policy.
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    
    <script src="login.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
